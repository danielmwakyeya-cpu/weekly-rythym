name: keke_days_app
description: "Keke's Weekly Rhythm - Personal Rhythm & Schedule Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  http: ^1.2.1
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_staggered_grid_view: ^0.7.0
  confetti: ^0.8.0
  shimmer: ^3.0.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  path_provider: ^2.1.4
  home_widget: ^0.7.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
